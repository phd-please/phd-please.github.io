<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.png">
<title>phd_please – 앱 개인정보 처리방침</title>
<meta name="description" content="phd_please 앱들의 개인정보 처리방침 모음">
<style>
  :root { --bg:#fbfbfd; --card:#ffffff; --text:#1d1d1f; --muted:#6e6e73; --line:rgba(0,0,0,.09); --accent:#5b5bf0; --accent2:#ff5d8f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b0b10; --card:#17171f; --text:#f5f5f7; --muted:#9a9aa5; --line:rgba(255,255,255,.1); --accent:#8a8aff; --accent2:#ff7aa6; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:640px; margin:0 auto; padding:64px 20px 80px; }
  h1 { font-size:2rem; letter-spacing:-.02em; margin:0 0 6px; }
  .lead { color:var(--muted); margin:0 0 36px; }
  .app { display:flex; gap:16px; align-items:center; background:var(--card); border:1px solid var(--line);
    border-radius:18px; padding:18px 20px; margin-bottom:14px; }
  .app img { width:64px; height:64px; border-radius:15px; flex:none; }
  .app h2 { font-size:1.1rem; margin:0; }
  .app p { margin:2px 0 8px; color:var(--muted); font-size:.9rem; }
  .links { display:flex; gap:8px; flex-wrap:wrap; }
  .links a { font-size:.85rem; font-weight:600; text-decoration:none; color:var(--accent);
    border:1px solid var(--line); border-radius:999px; padding:4px 12px; }
  .links a:hover { background:color-mix(in srgb, var(--accent) 12%, transparent); }
  footer { margin-top:40px; color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<main>
  <h1>phd_please</h1>
  <p class="lead">앱별 개인정보 처리방침 · Privacy Policies</p>

  <!-- 앱을 추가할 때 아래 .app 블록을 복사해서 이름과 링크만 바꾸세요 -->
  <div class="app">
    <img src="icon.png" alt="">
    <div>
      <h2>DDayBar</h2>
      <p>맥 상단바 D-Day · 수집하는 정보 없음</p>
      <div class="links">
        <a href="ddaybar-privacy.html">개인정보 처리방침</a>
        <a href="ddaybar-privacy-en.html">Privacy Policy (EN)</a>
      </div>
    </div>
  </div>

  <footer>문의: <a href="mailto:please.ph.d.please@gmail.com" style="color:inherit">please.ph.d.please@gmail.com</a></footer>
</main>
</body>
</html>
